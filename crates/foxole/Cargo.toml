[package]
name = "foxole"
version = "0.1.0"
edition = "2024"
publish = false
description = "COM automation for FoxDev Studio, as a Node addon (Windows only)"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
] }

[build-dependencies]
napi-build = "2"
